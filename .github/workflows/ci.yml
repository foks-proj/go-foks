name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Packages to lint + test. client/ is back in: the API drift that made it
      # untypecheckable after the first upstream merge is reconciled, and it is
      # where most of this fork's own changes live, so leaving it out meant our
      # own work was the only code CI never checked.
      #
      # integration-tests/ stays out because it needs a live postgres and the
      # rest of the server estate, which this workflow does not provision.
      # Upstream runs plain `./...` here; matching that needs the services
      # wired up first.
      GO_PKGS: "./server/... ./lib/... ./proto/... ./conf/... ./tools/... ./play/... ./client/..."
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make libpcsclite-dev pkg-config

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config --global user.email "ci@foks.test"
          git config --global user.name "FOKS CI"
          git config --global init.defaultBranch main

      - name: Lint (golangci-lint)
        run: go tool golangci-lint run $GO_PKGS

      - name: Test
        run: go test $GO_PKGS -count=1
